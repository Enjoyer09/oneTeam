# ==============================================================================
# oneTeam — Dependabot configuration
# ==============================================================================
#
# Keeps dependencies and GitHub Actions patched without anyone remembering to
# look. Grouped, weekly, and capped so the noise stays manageable.
#
# ECOSYSTEM LAYOUT
# ----------------
# This repo is an npm-workspaces monorepo: the root package.json owns `apps/*`
# and `packages/*` through one lockfile. `web/` and `mobile/` are NOT workspace
# members — each carries its own package-lock.json — so they need their own
# entries. `apps/api` is listed explicitly as well because its manifest is the
# one most worth watching; Dependabot resolves it against the root lockfile.
version: 2

updates:
  # --- Root workspace (API + packages) --------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # One PR for the routine patch/minor churn instead of dozens.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- NestJS Core API ------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "api"
    groups:
      api-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Supervisor web portal (standalone lockfile) --------------------------
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "web"
    groups:
      web-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Expo / React Native mobile client (standalone lockfile) --------------
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mobile"
    groups:
      mobile-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions used by the workflows ---------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
