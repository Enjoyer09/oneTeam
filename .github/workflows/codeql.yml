# ==============================================================================
# oneTeam — CodeQL static analysis
# ==============================================================================
#
# Scans the JavaScript/TypeScript across the whole repo (API, bot, web portal,
# mobile client) for injection, auth and data-flow defects that a linter does
# not model. Runs on every push and PR to main, and on a weekly schedule so a
# newly published query catches an old bug even when nothing has changed.
name: CodeQL

on:
  # Weekly-only to stay within the free GitHub Actions allowance. The per-push
  # and per-PR runs were the expensive part; the Monday schedule still scans the
  # whole tree so a newly published query catches an old bug. Run on demand from
  # the Actions tab any time, or uncomment the push/PR triggers below to restore
  # per-change scanning.
  schedule:
    # Mondays 05:17 UTC. An odd minute avoids the top-of-hour scheduling crowd.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

# CodeQL analysis needs to read the code and write results back to the Security
# tab; nothing else.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # `security-and-quality` is the broader pack; drop to
          # `security-extended` or the default if the queue gets too long.
          queries: security-and-quality

      # No compiled language here — CodeQL builds its JS/TS database directly
      # from source, so autobuild is a no-op that is kept only for clarity.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
