# ==============================================================================
# oneTeam — Scheduled database backup
# ==============================================================================
#
# Runs scripts/ops/db-backup.sh nightly and keeps the compressed dump as a
# workflow artifact. Also runnable on demand.
#
# REQUIRED SECRET
# ---------------
#   DATABASE_URL  — a connection string the runner can actually reach. GitHub's
#                   hosted runners are on the public internet, so this only works
#                   if the database accepts external connections (a Railway/Neon/
#                   RDS public endpoint with TLS). For a database that is only
#                   reachable on a private network, run this script from inside
#                   that network (a cron job on the host, a Railway cron service,
#                   or a self-hosted runner) instead — the script is the reusable
#                   part, this workflow is just one place to invoke it.
#
# WHERE BACKUPS GO
# ----------------
# Uploaded as a build artifact with a retention window. For durable, long-term
# storage push the dump to object storage instead — see the commented TODO at
# the end. An artifact is fine for short-horizon recovery, not for compliance
# retention.
name: DB Backup

on:
  schedule:
    # 02:30 UTC daily.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Prune local dumps older than N days (in-job only)"
        required: false
        default: "14"

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump + upload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGDUMP_DIR: ${{ github.workspace }}/backups
      RETENTION_DAYS: ${{ github.event.inputs.retention_days || '14' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — DATABASE_URL must be configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # The postgres client version should match or exceed the server's major
      # (16). ubuntu-latest ships a recent client; install to be explicit.
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run backup
        run: bash scripts/ops/db-backup.sh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          if-no-files-found: error
          retention-days: 14

      # TODO (durable storage): instead of / in addition to the artifact, push to
      # object storage. Example, with S3-compatible credentials as secrets:
      #
      #   - name: Upload to S3
      #     env:
      #       AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      #       AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      #     run: |
      #       aws s3 cp backups/ s3://your-bucket/oneteam/ --recursive \
      #         --exclude "*" --include "*.sql.gz"
