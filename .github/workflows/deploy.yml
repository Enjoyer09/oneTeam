# ==============================================================================
# oneTeam — Continuous Delivery (build & publish container images)
# ==============================================================================
#
# WHAT THIS DOES
# --------------
# Builds the three deployable images (API, bot, web portal) and pushes them to
# the GitHub Container Registry (GHCR) under this repository's namespace. It runs
# on every push to `main`, on version tags (`v*`), and on demand.
#
# WHAT IT DELIBERATELY DOES NOT DO
# --------------------------------
# It does not deploy to Railway. There is no Railway config in this repo, so the
# actual release step is left as a documented, commented-out block at the bottom
# rather than something that looks wired but is not. To turn it on you need a
# `RAILWAY_TOKEN` repository secret (Railway dashboard -> Account -> Tokens) and
# the `railway` CLI step uncommented. See docs/OBSERVABILITY.md and the
# "Deployment" section of README.md.
#
# SECRETS
# -------
# Nothing is hardcoded. Pushing to GHCR uses the automatically provided
# `GITHUB_TOKEN`; the (optional) Railway step references `${{ secrets.RAILWAY_TOKEN }}`.
name: Deploy

on:
  # Automatic runs are disabled to stay within the free GitHub Actions
  # allowance. These images are published to GHCR, but Railway deploys the
  # services independently and never consumes them, so building three Docker
  # images on every push was pure metered-minute cost. The workflow can still
  # be run by hand from the Actions tab. To restore push/tag builds, uncomment
  # the `push:` block below.
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Lowercased image path base, e.g. ghcr.io/owner/repo.
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Required to push packages to GHCR with the built-in token.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: bot
            context: .
            dockerfile: Dockerfile.bot
          - name: web
            context: ./web
            dockerfile: Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.name }}
          # `sha` on every build, `latest` on the default branch, and the
          # semver tag on `v*` pushes.
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Only publish on push/tag events; a manual dry-run still builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The web portal's API base URL is baked in at build time by Vite. It
          # is a public browser address, so it is safe to pass here; leave it
          # empty to have the portal call /api on its own origin (the normal
          # deployment). Provide it as a repo variable if you need an absolute URL.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Deploy — TODO: wire to Railway (or your platform of choice).
  #
  # Railway has no config in this repo yet. Once you create a project and mint a
  # token, add it as the `RAILWAY_TOKEN` repository secret and uncomment the job
  # below. It uses the images published above; adjust the service names to match
  # your Railway project.
  # ----------------------------------------------------------------------------
  #
  # deploy-railway:
  #   name: Deploy to Railway
  #   runs-on: ubuntu-latest
  #   needs: build-and-push
  #   if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
  #   environment: production
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7
  #     - name: Install Railway CLI
  #       run: npm i -g @railway/cli
  #     - name: Deploy
  #       env:
  #         RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  #       run: |
  #         # Example: redeploy each service from its published GHCR image, or
  #         # `railway up` from source. Match to your project's service names.
  #         railway redeploy --service api --yes
  #         railway redeploy --service bot --yes
  #         railway redeploy --service web --yes
