# =============================================================================
#  oneTeam — Continuous Integration
# =============================================================================
#
#  WHY THIS EXISTS
#  ---------------
#  Before this file, nothing checked the code automatically. A developer could
#  push a commit that did not compile, and the first person to notice would be
#  a user. Every check below exists because a real defect of that class was
#  found in this repository during the engineering review.
#
#  PRINCIPLE: the pipeline must be the *authority* on whether code is
#  mergeable — not a reviewer's opinion, and not a developer's laptop.
#
#  IMPORTANT — repository layout
#  -----------------------------
#  This workflow only runs if the project is its own git repository with
#  `.github/` at its root. At the time of writing, the git root sat at the
#  user's home directory, so these files would not be picked up. See
#  docs/ENGINEERING-STANDARDS.md §1 for the fix.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref. Without this, a rapid series of
# pushes queues up redundant work and the feedback loop gets slower exactly
# when it matters most.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep CI deterministic and quiet.
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — fast failure. Runs in seconds and catches the two classes of
  # mistake that are cheapest to fix and most embarrassing to ship: a leaked
  # credential, and code that does not compile.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (secrets, types, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # --- SECURITY -----------------------------------------------------------
      # This step previously said "Scan entire history", and used
      # `fetch-depth: 0` to make that possible. Both claims were false: the
      # scanner reads `git ls-files`, i.e. the tracked files at this commit, and
      # has no history mode at all. A security control that overstates its own
      # reach is worse than a narrow one, because it stops people looking.
      #
      # NOT IMPLEMENTED, AND DELIBERATELY: history scanning. A value that was
      # committed and later removed is still in the history, and this repository
      # has exactly that — a real SSH private key was committed before this
      # scanner existed. Turning on history scanning would make CI permanently
      # red with no fix short of rewriting history or carrying a baseline of
      # known-and-rotated findings. The honest position is to name the gap
      # rather than paper over it: if you need history checked, run
      # `git log -p --all | grep -i 'BEGIN.*PRIVATE KEY'` by hand.
      - name: Scan tracked files for committed credentials
        run: node scripts/quality/secret-scan.mjs --all

      # --- CORRECTNESS --------------------------------------------------------
      - name: Type check
        run: npm run type-check

      # The mobile tree has its own tsconfig and its own structural guard. Both
      # were written to run WITHOUT the Expo dependency tree (that is why the
      # native imports are isolated behind interfaces), so they belong here.
      # They were not run by CI at all before, which is the same defect class as
      # a test suite nothing invokes.
      - name: Mobile type check
        run: npm run mobile:check

      - name: Mobile configuration guard
        run: npm run mobile:config

      - name: Lint
        run: npm run lint

      # Formatting is blocking. It was `continue-on-error: true` while 59 of 69
      # first-party files predated any formatter; that reformat has since
      # happened and `format:check` passes, so the escape hatch now only serves
      # to let unformatted code through.
      - name: Check formatting
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Job 2 — the test suite. Runs after `verify` so that a broken build does not
  # waste minutes running tests.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run test suite
        run: npm run test:all

  # ---------------------------------------------------------------------------
  # Job 3 — prove the artefact actually builds. A green type check does not
  # guarantee a working bundle; bundler and CSS pipeline failures only appear
  # here.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web portal
        run: npm run web:build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: error
