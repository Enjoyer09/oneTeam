# =============================================================================
#  oneTeam — Continuous Integration
# =============================================================================
#
#  WHY THIS EXISTS
#  ---------------
#  Before this file, nothing checked the code automatically. A developer could
#  push a commit that did not compile, and the first person to notice would be
#  a user. Every check below exists because a real defect of that class was
#  found in this repository during the engineering review.
#
#  PRINCIPLE: the pipeline must be the *authority* on whether code is
#  mergeable — not a reviewer's opinion, and not a developer's laptop.
#
#  IMPORTANT — repository layout
#  -----------------------------
#  This workflow only runs if the project is its own git repository with
#  `.github/` at its root. That was once not the case: the git root sat at the
#  user's home directory and these files were not picked up at all. See
#  docs/ENGINEERING-STANDARDS.md §1, which records the move. The layout is
#  correct now — every push runs the jobs below.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref. Without this, a rapid series of
# pushes queues up redundant work and the feedback loop gets slower exactly
# when it matters most.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep CI deterministic and quiet.
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — fast failure. Runs in seconds and catches the two classes of
  # mistake that are cheapest to fix and most embarrassing to ship: a leaked
  # credential, and code that does not compile.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (secrets, types, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # --- SECURITY -----------------------------------------------------------
      # This step previously said "Scan entire history", and used
      # `fetch-depth: 0` to make that possible. Both claims were false: the
      # scanner reads `git ls-files`, i.e. the tracked files at this commit, and
      # has no history mode at all. A security control that overstates its own
      # reach is worse than a narrow one, because it stops people looking.
      #
      # NOT IMPLEMENTED, AND DELIBERATELY: history scanning. A value that was
      # committed and later removed is still in the history, and this repository
      # has exactly that — a real SSH private key was committed before this
      # scanner existed. Turning on history scanning would make CI permanently
      # red with no fix short of rewriting history or carrying a baseline of
      # known-and-rotated findings. The honest position is to name the gap
      # rather than paper over it: if you need history checked, run
      # `git log -p --all | grep -i 'BEGIN.*PRIVATE KEY'` by hand.
      - name: Scan tracked files for committed credentials
        run: node scripts/quality/secret-scan.mjs --all

      # --- CORRECTNESS --------------------------------------------------------
      - name: Type check
        run: npm run type-check

      # The mobile tree has its own tsconfig and its own structural guard. The
      # structural guard was written to run WITHOUT the Expo dependency tree
      # (that is why the native imports are isolated behind interfaces).
      #
      # `mobile:check` is NOT like that any more, and the difference matters.
      # It type-checks the React Native screens, so it needs `react-native`,
      # `expo-*` and `@types/react` to actually resolve. The root `npm ci` does
      # not provide them (`mobile` is not a workspace member), so without the
      # step below the check reports success precisely because the modules it
      # was supposed to resolve are absent — a check that cannot fail. Measured:
      # on 2026-09-16 this step was red for four consecutive pushes with
      # "Cannot find module 'react-native'" while every local gate was green,
      # because locally `mobile/node_modules` existed and in CI it did not.
      - name: Install mobile dependencies
        run: cd mobile && npm ci --no-audit --no-fund

      - name: Mobile type check
        run: npm run mobile:check

      - name: Mobile configuration guard
        run: npm run mobile:config

      # The contract between the React Native screens and the Xcode UI test
      # (plan 3.4). It runs its own self-test, so it cannot quietly stop biting.
      - name: UI test identifiers
        run: npm run test:ui-ids

      - name: Lint
        run: npm run lint

      # Formatting is blocking. It was `continue-on-error: true` while 59 of 69
      # first-party files predated any formatter; that reformat has since
      # happened and `format:check` passes, so the escape hatch now only serves
      # to let unformatted code through.
      - name: Check formatting
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Job 2 — the test suite. Runs after `verify` so that a broken build does not
  # waste minutes running tests.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `test:all` includes `test:web`, and `web` is not a workspace member —
      # the root install never creates web/node_modules. Same trap as the build
      # job below; measured 2026-11-08: `vitest: not found`, exit 127.
      - name: Install web portal dependencies
        run: cd web && npm ci --no-audit --no-fund

      - name: Run test suite
        run: npm run test:all

  # ---------------------------------------------------------------------------
  # Job 3 — prove the artefact actually builds. A green type check does not
  # guarantee a working bundle; bundler and CSS pipeline failures only appear
  # here.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `web` is NOT an npm workspace member — `workspaces` lists `apps/*` and
      # `packages/*` — and `web:build` runs
      # `./web/node_modules/typescript/bin/tsc` and `./web/node_modules/vite/bin/vite.js`.
      # Those paths exist on a developer's machine, where somebody has run
      # `cd web && npm install` at least once, and nowhere else. So the web
      # portal's production build had never actually been verified: this step
      # failed the first time it was reached, with
      # `Cannot find module '.../web/node_modules/typescript/bin/tsc'`.
      #
      # Installing the tree explicitly is what a developer does and is the
      # smaller change. The alternative — promoting `web` to a workspace member
      # — means one root lockfile and deleting web/package-lock.json, which is a
      # dependency-management decision rather than a CI fix.
      - name: Install web portal dependencies
        run: cd web && npm ci --no-audit --no-fund

      - name: Build web portal
        run: npm run web:build

      # No artifact upload. This job's only purpose is to fail on a bundle that
      # does not build; nothing consumes `web/dist` afterwards — Railway deploys
      # from the repo, not from a GitHub artifact — so uploading it only spent
      # metered minutes and artifact storage to imply a handoff that never
      # happens. (The live-tests job still uploads its API log on failure,
      # because a human reads that one.)

  # ---------------------------------------------------------------------------
  # Job 4 — the iOS UI test (plan 3.4). The only check in this pipeline that
  # actually launches the app and taps it.
  #
  # WHY IT RUNS ON macOS AND WHY IT IS LAST
  # ---------------------------------------
  # A simulator only exists on macOS, and this job builds the whole native
  # stack, so it is by far the most expensive thing here. It is gated on
  # `verify` for the same reason `test` and `build` are: a type error should
  # cost 30 seconds, not 20 minutes of macOS runner time.
  #
  # WHAT THIS JOB PROVES THAT NOTHING ELSE HERE DOES
  # ------------------------------------------------
  # That the UI test target is really created by
  # `mobile/plugins/withUITests.js` on a clean machine, that the app really
  # launches, and that the identifiers in `mobile/uitests/testids.json` are
  # reachable by XCTest — not merely present in the source. The `test:ui-ids`
  # step in `verify` proves the identifiers exist; it cannot prove XCTest can
  # reach them, which is a distinction that already cost one round of fixes
  # (a `TouchableOpacity` with no `accessibilityRole` is invisible to
  # `app.buttons[...]`, and a `disabled` prop never reaches XCTest unless
  # `accessibilityState` says so).
  # ---------------------------------------------------------------------------
  ui-tests:
    name: UI tests (iOS)
    runs-on: macos-latest
    needs: verify
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The app imports `@oneteam/types` at RUNTIME (clock/log in
      # offlineQueue, SmartCameraOverlay, CameraAuditScreen), and Metro
      # resolves it through the root workspace symlink to
      # packages/types/dist. `mobile` is not a workspace member, so the
      # mobile-only install below provides neither the symlink nor the
      # build. Measured 2026-11-08: without these two steps Metro dies with
      # "Unable to resolve '@oneteam/types'" and every UI test fails with
      # "login.storeCodeInput never appeared".
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspace packages
        run: npm run build:packages

      - name: Install mobile dependencies
        run: cd mobile && npm ci --no-audit --no-fund

      # The Xcode project is generated, not committed, and the UI test target
      # does not exist in the Expo template. `withUITests.js` creates it here —
      # which is the entire reason the target is reproducible. On a machine
      # where someone created the target by hand in Xcode, this job would not
      # see it.
      - name: Generate the native project
        run: cd mobile && EXPO_NO_TYPESCRIPT_SETUP=1 npx expo prebuild --platform ios --no-install

      # `withDevServers.js` patches the shared scheme so that Xcode's Run button
      # starts the API and Metro by itself. Prebuild succeeding is NOT proof it
      # worked: a plugin that is registered but silently inert would also let
      # prebuild finish, and the scheme would simply carry no <PreActions>.
      # This asserts the block actually reached the generated file.
      #
      # Measured on 2026-09-18: the first version of the plugin returned nothing
      # from its `withXcodeProject` callback, which broke the mod chain and made
      # prebuild fail with "Cannot destructure property 'modRequest' of
      # 'undefined'". The message names the base mod, not the offending file, so
      # this step failing is the fast signal that the plugin is at fault.
      - name: Assert the Run pre-action reached the generated scheme
        run: |
          set -euo pipefail
          SCHEME=$(ls mobile/ios/*.xcodeproj/xcshareddata/xcschemes/*.xcscheme | head -1)
          test -n "$SCHEME"
          echo "Checking $SCHEME"
          grep -q '<PreActions>' "$SCHEME"
          grep -q 'ensure-dev-servers.sh' "$SCHEME"
          grep -q 'oneTeamFieldAuditUITests' "$SCHEME"
          xmllint --noout "$SCHEME"

      - name: Install CocoaPods dependencies
        run: cd mobile/ios && pod install

      # Which simulators exist depends on the Xcode version the runner happens
      # to have, so the destination cannot be a hardcoded device name. Take the
      # first available iPhone and pass its UDID, which is stable for the life
      # of the job.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator is available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          # Already-booted is not an error here; `xcodebuild test` will use it.
          xcrun simctl boot "$UDID" || echo "already booted"
          # `boot` returns while the device is still starting. Wait for the
          # boot to finish so the location fixture below is set on a device
          # whose locationd is actually up — a set lost during boot surfaces
          # 10 minutes later as a 30s timeout in every location test.
          xcrun simctl bootstatus "$UDID" -b

          echo "destination=id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run the UI tests
        run: bash scripts/dev/test-ios.sh
        env:
          ONETEAM_UI_TEST_DESTINATION: ${{ steps.sim.outputs.destination }}
          # Grant the location permission with simctl AFTER the app is
          # installed, instead of tapping the system prompt from the test.
          # The prompt's button labels are iOS-version-dependent and proved
          # unreliable on the iOS 26 runner (measured 2026-11-08: permission
          # ended up denied). The script installs the app, grants, sets the
          # demo store's location (40.4093,49.8671), then runs the tests — so
          # no prompt ever appears and the fixture is deterministic.
          ONETEAM_UI_TEST_GRANT_LOCATION: "1"

  # ---------------------------------------------------------------------------
  # Job 5 — dependency audit. NON-BLOCKING on purpose.
  #
  # The install steps everywhere use `--no-audit` to keep them fast and
  # deterministic; this job is where the audit actually happens, on its own,
  # so a newly disclosed advisory is surfaced without turning every unrelated
  # push red. `--audit-level=high` reports high and critical only, and the
  # `|| true` plus `continue-on-error` make the result informational — read it,
  # do not let it gate a merge. Promote it to blocking once the baseline is
  # clean and someone owns triage.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit (root workspaces)
        run: npm audit --audit-level=high || true

      - name: npm audit (web portal)
        run: cd web && npm ci --no-audit --no-fund && npm audit --audit-level=high || true

      - name: npm audit (mobile client)
        run: cd mobile && npm ci --no-audit --no-fund && npm audit --audit-level=high || true

  # ---------------------------------------------------------------------------
  # Job 6 — DB-backed live tests + break detectors.
  #
  # WHAT THIS PROVES THAT `test` DOES NOT
  # -------------------------------------
  # The `test` job runs `test:all`, which is the in-memory tier — it never opens
  # a socket to Postgres or to a running API. The suites below (`test:live`) talk
  # HTTP to a compiled API that is talking to a real PostgreSQL, which is the only
  # place the write-through persistence, the migration runner, device/panel token
  # tables and the cross-replica refresh are actually exercised. The break
  # detectors then prove those suites still bite by reintroducing each defect.
  #
  # WHY IT IS GATED (continue-on-error: false)
  # ------------------------------------------
  # This is the only job that stands up Postgres, seeds it, boots the API and
  # drives a dozen suites plus three break detectors — several of which spawn
  # their own API on their own port and have real external touch-points (the
  # bot, the mobile runner). It is blocking because the one thing it used to
  # guarantee was that it never failed: `test:live` was a `&&` chain, so the
  # first red suite ended the run, and `continue-on-error: true` filed the
  # neutral result as success. `scripts/quality/run-live-suites.mjs` replaces
  # the chain and runs every suite regardless of earlier failures, so a red
  # live tier now says which suites are red and fails the job.
  #
  # Verified green on 2026-10-06 (twice, on a throwaway Postgres): 14 suites,
  # 562 checks, 0 failed, then all three break detectors each breaking their own
  # check. `test:live:suites` rather than `test:live` here because the build
  # step above already produced apps/api/dist/main.js and the API is running
  # from it — `test:live` would rebuild that tree underneath a live process.
  # ---------------------------------------------------------------------------
  live-tests:
    name: Live tests (Postgres + break detectors)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    # Blocking as of 2026-10-06, on the condition this comment used to set:
    # "flip once it is reliably green". It is — 562 checks across 14 suites on
    # a throwaway Postgres, then again after every fix below, plus all three
    # break detectors. Before it was `continue-on-error: true`, and with the
    # `&&` chain that `test:live` used to be, a red `test:stores` meant twelve
    # suites never ran while this job still reported neutral. A job that cannot
    # fail is not a check, and 552 green checks were hiding under it.
    continue-on-error: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneteam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Points at the service container above.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/oneteam
      PGPASSWORD: postgres
      # Where the suites and the bot look for the API, and the seeded admin the
      # service credential names.
      ONETEAM_API_URL: http://localhost:3001
      ONETEAM_API_TOKEN: oneteam-user:usr-admin-001
      VITE_API_BASE_URL: http://localhost:3001
      # The API boots fine without a real bot token (webhooks answer 503, which
      # these suites do not use). A value is supplied so nothing logs a fatal on
      # start-up. NOT a real credential.
      TELEGRAM_BOT_TOKEN: "ci-not-a-real-bot-token"
      TELEGRAM_WEBHOOK_SECRET: "ci-not-a-real-webhook-secret"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:5173"
      # Some suites route through localhost; keep any runner proxy out of the way.
      # Only one spell — GitHub Actions treats `NO_PROXY` and `no_proxy` as the
      # same key (case-insensitive) and a duplicate is a workflow syntax error
      # that kills the whole run before any job starts.
      NO_PROXY: "localhost,127.0.0.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `web` and `mobile` are not workspace members and carry their own
      # lockfiles; `web:test` and `mobile:test` (both part of `test:live`) need
      # their trees present, exactly as the verify/build jobs install them.
      - name: Install web portal dependencies
        run: cd web && npm ci --no-audit --no-fund

      - name: Install mobile dependencies
        run: cd mobile && npm ci --no-audit --no-fund

      # Compiles packages/* and apps/api to apps/api/dist/main.js, which every
      # step below runs directly (the break detectors rebuild it themselves).
      - name: Build packages and API
        run: |
          npm run build:packages
          npm run api:build

      # Create the base schema and seed rows directly. The API's start-up
      # migration runner then re-applies the (idempotent) schema and applies
      # db/migrations/*.sql on top, recording them in schema_migrations. Doing
      # the seed here — rather than letting the API do it — is what puts
      # usr-admin-001 in the database so the service credential resolves.
      - name: Provision database (schema + seed)
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/api-schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/api-seed.sql

      - name: Run DB-backed live suites
        run: |
          set -euo pipefail
          echo "Starting API against Postgres..."
          node apps/api/dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          # Wait for /api/health (the API applies migrations on the way up).
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "API healthy after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::API did not become healthy within ~120s"
              cat "$RUNNER_TEMP/api.log" || true
              exit 1
            fi
            sleep 2
          done

          npm run test:live:suites

      # The break detectors are the "green test is not proof" gate. They run
      # regardless of the live-suite outcome so a failure there does not hide
      # them. `test:break` and `test:break:credentials` patch mobile source and
      # restore it; `test:break:device-revoke` needs DATABASE_URL and stands up
      # its own API on its own port.
      - name: Break detector — offline queue
        if: always()
        run: npm run test:break

      - name: Break detector — credential policy
        if: always()
        run: npm run test:break:credentials

      - name: Break detector — device revocation (DB-backed)
        if: always()
        run: npm run test:break:device-revoke

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-tests-api-log
          path: ${{ runner.temp }}/api.log
          if-no-files-found: ignore
          retention-days: 7
