server {
    listen 80;
    # Listen on IPv6 as well.
    #
    # The official nginx image normally adds this line for you, but its
    # 10-listen-on-ipv6-by-default.sh script skips any config that differs from
    # the packaged default — which ours does. Without it, `localhost` inside the
    # container resolves to ::1 first and every check against localhost is
    # refused, because nothing is listening there.
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for High Performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # --------------------------------------------------------------------------
    # API reverse proxy to the NestJS API service
    # --------------------------------------------------------------------------
    # API_UPSTREAM is filled in when the container starts, by the official nginx
    # image's envsubst hook (see NGINX_ENVSUBST_FILTER in the Dockerfile). It
    # must expand to a bare origin — scheme, host, port, no trailing slash:
    #
    #     docker compose  ->  http://api:3001
    #     Railway         ->  http://api.railway.internal:3001
    #
    # THE UPSTREAM IS A VARIABLE, ON PURPOSE.
    #
    # A literal `proxy_pass http://api:3001;` is simpler but fails in two ways
    # that are hard to diagnose from the outside:
    #
    #   1. nginx resolves a literal name ONCE, at start-up, and keeps that
    #      address forever. On a platform that re-creates containers on every
    #      deploy, the web container ends up pointing at an address the API no
    #      longer occupies — and the proxy stays broken until web is restarted,
    #      with nothing in the log to say so.
    #   2. A literal upstream also resolves at start-up, so nginx REFUSES TO
    #      START when the name is not ready yet:
    #
    #          [emerg] host not found in upstream "..."
    #
    # With a variable, resolution happens per request against `resolver`, and
    # `$request_uri` has to be appended by hand because nginx no longer
    # reconstructs the original path on its own.
    #
    # The resolver address itself comes from the container's /etc/resolv.conf
    # via 15-dns-resolver.envsh — Docker answers at 127.0.0.11, Railway does not,
    # so any hardcoded value is wrong on the other platform.
    #
    # NOTE: the supervisor portal does not call this API today — it reads from
    # Supabase directly. The block is kept because the mobile client and the
    # Telegram webhook are expected to use it.
    location /api/ {
        # Resolved per request, IPv4 only. See 15-dns-resolver.envsh for why
        # IPv6 must be excluded here: Railway's DNS returns AAAA records that
        # this container cannot route, and the packets are dropped silently.
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        set $api_upstream "${API_UPSTREAM}";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        # Required when API_UPSTREAM is an https:// origin: without SNI the TLS
        # handshake presents no server name and an edge that hosts many domains
        # answers with the wrong certificate.
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
