server {
    listen 80;
    # Listen on IPv6 as well.
    #
    # The official nginx image normally adds this line for you, but its
    # 10-listen-on-ipv6-by-default.sh script skips any config that differs from
    # the packaged default — which ours does. Without it, `localhost` inside the
    # container resolves to ::1 first and every check against localhost is
    # refused, because nothing is listening there.
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for High Performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # --------------------------------------------------------------------------
    # API reverse proxy to the NestJS API service
    # --------------------------------------------------------------------------
    # The upstream is held in a variable and resolved per request, not at start
    # up. That detail is what keeps this container alive.
    #
    # With a literal host — `proxy_pass http://api:3001;` — nginx resolves the
    # name while loading its configuration and REFUSES TO START if it cannot:
    #
    #     [emerg] host not found in upstream "api"
    #
    # Inside docker-compose that name exists, so it works. On any platform whose
    # private network uses different hostnames — Railway serves the API at
    # `api.railway.internal` — the web container crash-loops instead of serving
    # the portal, and the deploy never becomes healthy.
    #
    # `$request_uri` is appended explicitly because nginx does not reconstruct
    # the original path when proxy_pass contains a variable. The result is
    # identical to the previous literal form: /api/tasks is forwarded verbatim.
    #
    # NOTE: the supervisor portal does not call this API today — it reads from
    # Supabase directly. This block is kept because the mobile client and the
    # Telegram webhook are expected to use it, and because removing a working
    # capability to dodge a configuration bug is the wrong trade. If you deploy
    # on Railway and want it functional, set API_UPSTREAM to the API service's
    # private address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream "http://api:3001";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
