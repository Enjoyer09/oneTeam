server {
    listen 80;
    # Listen on IPv6 as well.
    #
    # The official nginx image normally adds this line for you, but its
    # 10-listen-on-ipv6-by-default.sh script skips any config that differs from
    # the packaged default — which ours does. Without it, `localhost` inside the
    # container resolves to ::1 first and every check against localhost is
    # refused, because nothing is listening there.
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for High Performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # --------------------------------------------------------------------------
    # API reverse proxy to the NestJS API service
    # --------------------------------------------------------------------------
    # API_UPSTREAM is filled in when the container starts, by the official nginx
    # image's envsubst hook (see NGINX_ENVSUBST_FILTER in the Dockerfile). It
    # must expand to a bare origin — scheme, host, port, no trailing slash:
    #
    #     docker compose  ->  http://api:3001
    #     Railway         ->  https://api-production-c17b.up.railway.app
    #
    # On Railway the PUBLIC origin is used rather than the private
    # `api.railway.internal` address. The private name resolves, but connections
    # to it hang rather than fail — a 30-second timeout, not a refused
    # connection — which points at an IPv6 address nginx prefers and the
    # container cannot route. A literal upstream resolves once at start-up and
    # never re-resolves, so a private address would additionally go stale on
    # every API redeploy. The public hostname is stable and costs one extra hop,
    # which is irrelevant at this traffic level.
    #
    # Deliberately a LITERAL proxy_pass with no URI part, for two reasons:
    #
    #   1. nginx preserves the original request path automatically, so /api/tasks
    #      is forwarded verbatim. Putting a variable here would force us to
    #      append $request_uri by hand instead.
    #   2. A variable in proxy_pass switches nginx to per-request DNS, which
    #      requires a `resolver` directive pointing at a live nameserver. That
    #      address is platform-specific — Docker's embedded DNS is 127.0.0.11
    #      and does not exist on Railway — so any hardcoded value is wrong on
    #      the other platform, and a wrong one turns every /api/ request into a
    #      502 with nothing in the log but "no resolver defined".
    #
    # The trade: nginx resolves this name once, at start-up, and REFUSES TO
    # START if it fails:
    #
    #     [emerg] host not found in upstream "..."
    #
    # So the api service must exist before web does. In both compose and
    # Railway the two live in the same private network, and the name answers as
    # soon as the service is created.
    #
    # NOTE: the supervisor portal does not call this API today — it reads from
    # Supabase directly. The block is kept because the mobile client and the
    # Telegram webhook are expected to use it.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        # Required when API_UPSTREAM is an https:// origin: without SNI the TLS
        # handshake presents no server name and an edge that hosts many domains
        # answers with the wrong certificate.
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
