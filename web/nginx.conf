# ------------------------------------------------------------------------------
# Portal credential — the caller's own key wins
# ------------------------------------------------------------------------------
# The supervisor portal authenticates against the API, which requires an
# `Authorization` bearer. Two different credentials can arrive here, and the
# order they are considered in is the whole of this section.
#
#   the panel's own key   — sent by the browser once someone has signed in. It
#                           names a real person, it is revocable, and it is what
#                           makes `audit_logs` able to say who approved what.
#
#   PORTAL_TOKEN          — injected here. This is the *pre-setup* credential:
#                           before any key has been issued the panel has nothing
#                           of its own to send, and this is what keeps it working
#                           exactly as it did before logins existed. The API
#                           accepts it only while the panel is unconfigured (see
#                           `mayUseRoute` in auth.guard.ts), so it stops being a
#                           way in the moment the first key exists.
#
# Putting the token in a VITE_ variable instead would be wrong twice over: Vite
# inlines it into the JavaScript bundle at build time, so it would ship to every
# visitor and could not be rotated without rebuilding the image.
#
# WHY THREE MAPS AND NOT ONE
# --------------------------
# The first version of this file had a single map that replaced the Authorization
# header with `Bearer ${PORTAL_TOKEN}` for every /api/portal/ request. It worked,
# and it threw away the caller's own credential — so a signed-in supervisor's
# actions were still recorded against the seeded administrator, and the login
# would have been decorative. These three express the rule in order:
#
#   1. $portal_injected  — the fallback header, or nothing at all when
#                          PORTAL_TOKEN is unset. Mapping the constant is what
#                          makes "remove the fallback" a clean operation: without
#                          it the header would be `Bearer ` (a malformed
#                          credential the API rejects) instead of absent.
#   2. $portal_fallback  — the caller's Authorization if there is one, otherwise
#                          the fallback.
#   3. $portal_authorization — applied only to /api/portal/. Everything else on
#                          /api/ keeps whatever the caller supplied, so the
#                          mobile client and the Telegram webhook are untouched.
#
# PORTAL_TOKEN is substituted at container start by the nginx image's envsubst
# hook (see NGINX_ENVSUBST_FILTER in the Dockerfile).
map "${PORTAL_TOKEN}" $portal_injected {
    ""       "";
    default  "Bearer ${PORTAL_TOKEN}";
}

map $http_authorization $portal_fallback {
    default  $http_authorization;
    ""       $portal_injected;
}

map $request_uri $portal_authorization {
    default           $http_authorization;
    "~^/api/portal/"  $portal_fallback;
}

server {
    listen 80;
    # Listen on IPv6 as well.
    #
    # The official nginx image normally adds this line for you, but its
    # 10-listen-on-ipv6-by-default.sh script skips any config that differs from
    # the packaged default — which ours does. Without it, `localhost` inside the
    # container resolves to ::1 first and every check against localhost is
    # refused, because nothing is listening there.
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Content-Security-Policy — hardens the localStorage panel key against XSS
    # --------------------------------------------------------------------------
    # The panel key that authenticates a signed-in supervisor lives in
    # localStorage, so any injected script would be able to read it. A strict CSP
    # is the practical defence: it stops the browser executing attacker-supplied
    # script in the first place.
    #
    #   script-src 'self' <hash>  — only our own bundle runs, plus the one inline
    #                    theme IIFE in index.html, allowlisted by its sha256 so we
    #                    do NOT need 'unsafe-inline' (which would defeat the point).
    #                    If that inline script's bytes change, recompute the hash.
    #   style-src 'unsafe-inline' — Tailwind and the app set styles inline; there
    #                    is no hash-stable way around this without a build change.
    #   img-src data: blob: https: — planogram references and audit photos are
    #                    remote https URLs or inline data: URIs (see main.tsx
    #                    placeholder), so all three are required or images break.
    #   connect-src 'self' — every API call is same-origin through the /api proxy.
    #
    # Set at the server level so the SPA document (served by `location /`, which
    # has no add_header of its own) inherits it. The static-asset and 50x
    # locations below carry their own add_header and therefore do NOT inherit
    # this — that is fine, CSP only governs the HTML document response.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-NxvTC/dARrj02zNc8V9u5Rui1mcE5DEySgyUiCTVNSk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Request body ceiling for the whole server, including the /api/ proxy.
    # --------------------------------------------------------------------------
    # nginx's default is 1 MB. Field audits submitted with the photo INLINE
    # (STORAGE_DRIVER != s3, or the presigned PUT failing over to the inline
    # fallback) arrive as a base64 data: URL inside the JSON body — a ~1.1 MB
    # JPEG becomes ~1.5 MB encoded, over the 1 MB default, so the core submit
    # flow would 413 at the proxy before ever reaching the API. Sized a touch
    # above the API's own 5 MB JSON parser (apps/api/src/main.ts) so that a body
    # between the two limits is refused by the API with its clear Azerbaijani
    # PAYLOAD_TOO_LARGE message rather than nginx's bare 413, while anything
    # genuinely oversized is still bounded here.
    client_max_body_size 6m;

    # Gzip Compression for High Performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # --------------------------------------------------------------------------
    # API reverse proxy to the NestJS API service
    # --------------------------------------------------------------------------
    # API_UPSTREAM is filled in when the container starts, by the official nginx
    # image's envsubst hook (see NGINX_ENVSUBST_FILTER in the Dockerfile). It
    # must expand to a bare origin — scheme, host, port, no trailing slash:
    #
    #     docker compose  ->  http://api:3001
    #     Railway         ->  https://api-production-c17b.up.railway.app
    #
    # THE UPSTREAM IS DELIBERATELY A LITERAL, NOT A VARIABLE.
    #
    # Holding it in a variable and resolving per request looks more robust, and
    # it is not. Two things go wrong:
    #
    #   1. A variable forces nginx to use its OWN resolver, which needs an
    #      explicit `resolver` address. That address is platform-specific and
    #      there is no portable value. On Railway /etc/resolv.conf lists an IPv6
    #      nameserver first (`fd12::10`), which nginx reads as host:port and
    #      rejects outright — the container crash-loops with
    #         [emerg] invalid port in resolver "fd12::10"
    #      Falling back to Docker's 127.0.0.11 is worse: that address does not
    #      exist on Railway, so every lookup fails and every request returns 502.
    #   2. A literal resolves once at start-up through the system resolver, which
    #      always works. The cost is that the address is cached for the life of
    #      the container — acceptable here, because it points at a platform edge
    #      whose addresses are stable, not at another container.
    #
    # Note what a literal does NOT need: `$request_uri` appended by hand. nginx
    # preserves the original path on its own when proxy_pass has no URI part.
    #
    # THE HOST HEADER MUST BE $proxy_host, NOT $host — THIS IS THE WHOLE TRICK.
    #
    # Railway (like most PaaS edges) routes an incoming request by its Host
    # header. `$host` is the host the BROWSER asked for, i.e. the web service's
    # own domain. Forwarding that to an upstream that lives on the same edge
    # sends the request back to this very container:
    #
    #     browser -> web -> edge (Host: web-…) -> web -> edge -> web -> …
    #
    # nginx happily proxies to itself until the client gives up, so the browser
    # sees a hang and the access log fills with 499s. Measured: one single
    # request produced 25+ log lines in the same second, arriving from many
    # different edge addresses. `$proxy_host` is the host named in proxy_pass,
    # which is what the edge needs to pick the API service.
    #
    # NOTE: the portal calls this API for every read and write. It used to read
    # from Supabase directly, which meant it rendered a hardcoded demo store set
    # while the real database held different data.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        # Required when API_UPSTREAM is an https:// origin: without SNI the TLS
        # handshake presents no server name and an edge that hosts many domains
        # answers with the wrong certificate.
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # $proxy_host, not $host — see the long note above. With $host this
        # becomes a self-referential loop and every request hangs.
        proxy_set_header Host $proxy_host;
        # Portal requests get the server-side credential; everything else keeps
        # the caller's own. See the map at the top of this file.
        proxy_set_header Authorization $portal_authorization;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
