# ==============================================================================
# oneTeam — production / staging stack
# ==============================================================================
#
# Four services in one place: PostgreSQL, the NestJS API, the supervisor web
# portal and the Telegram bot worker.
#
# REQUIRED ENVIRONMENT
# --------------------
# This file deliberately has no fallback values for secrets. It used to default
# POSTGRES_PASSWORD to a hardcoded string, which meant a stack started without
# a .env file came up with a publicly known database password — and, because
# the same string was baked into DATABASE_URL, nothing warned you. A deployment
# that is insecure by default is worse than one that refuses to start.
#
# Compose now stops with a clear message if any of these is missing:
#
#     POSTGRES_PASSWORD
#     DATABASE_URL
#     TELEGRAM_WEBHOOK_SECRET
#     TELEGRAM_BOT_TOKEN
#
# Copy .env.production.example to .env.production, fill it in, then:
#
#     docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# NOTE ON THE WEB PORTAL
# ----------------------
# The portal's API address is a *build* argument, not a runtime variable: Vite
# compiles it into the bundle. See the web service below.
#
# There were three more build arguments here for Supabase — a URL, an anon key
# and a service-role key — passed to both the API and the bot as runtime
# variables as well, each with a `mock-oneteam.supabase.co` fallback. No code in
# this repository has read any of them since the portal, the bot and the mobile
# client were all pointed at the API. They are gone. A variable that is passed
# and never read is worse than a missing one: it makes the stack look
# configured, and the fallback values made it look configured against a host
# that does not exist.
# ==============================================================================

# The top-level `version` key is obsolete in Compose v2 and is ignored. It was
# removed here because Compose warns about it on every single command.

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: oneteam-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default. See the header: a silent, well-known password is a bug.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.production.example to .env.production and set it}
      POSTGRES_DB: ${POSTGRES_DB:-oneteam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applied only when the data directory is empty, i.e. on first boot.
      #
      # These are the API's schema, not the Supabase one. The API reads
      # users / regions / stores / campaigns / task_templates / store_tasks /
      # task_evidences / audit_logs; init_schema.sql and seed.sql describe a
      # different product (profiles / tasks / task_assignments / submissions)
      # and both files declare a `stores` table, so they cannot share a
      # database. See db/api-schema.sql for the full explanation.
      - ./db/api-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/api-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oneteam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oneteam-network

  # ----------------------------------------------------------------------------
  # 2. oneTeam NestJS Core API Engine
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: oneteam-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - it must point at the postgres service}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      # Verifies that an incoming webhook really came from Telegram. The API
      # returns 503 rather than accepting unverified callers when this is unset,
      # so it is required here too.
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required - generate one with openssl rand -hex 32}"
      # Comma-separated allow-list. An empty value blocks every browser origin.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      # ------------------------------------------------------------------
      # Photo storage — OPTIONAL, and inline by default.
      # ------------------------------------------------------------------
      # Left unset, a submitted photo is stored in the database as a data URL,
      # exactly as before. Set STORAGE_DRIVER=s3 together with the four S3_*
      # values below and it is uploaded to the bucket instead, with only the URL
      # stored. Any S3-compatible provider works: Railway Buckets, Cloudflare R2,
      # MinIO, AWS.
      #
      # There is no half-configured state: if STORAGE_DRIVER=s3 is set and a
      # required value is missing, the API keeps photos inline and says so at
      # error level, and /api/health reports which driver is actually in use.
      #
      # STORAGE_DRIVER: ${STORAGE_DRIVER:-inline}
      # S3_ENDPOINT: ${S3_ENDPOINT:-}
      # S3_REGION: ${S3_REGION:-}
      # S3_BUCKET: ${S3_BUCKET:-}
      # S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      # S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # ------------------------------------------------------------------
      # Device enrolment — RECOMMENDED for anything past a pilot.
      # ------------------------------------------------------------------
      # A mobile installation enrols itself by presenting the store's code,
      # because that is the same proof the Telegram channel already accepts and
      # there is no credential to ship inside a downloadable app bundle.
      #
      # A store code is semi-public — printed on briefings and shared between
      # colleagues — so someone who learns one can enrol a device for that store.
      # Setting this turns the store code into a username and this into the
      # password. Left unset, a store code alone is enough.
      #
      # ONETEAM_ENROLLMENT_SECRET: ${ONETEAM_ENROLLMENT_SECRET:-}
      # Wrong guesses allowed per address per 15 minutes before enrolment is
      # refused. Only failures count, so a shop full of colleagues signing in
      # behind one address is unaffected. Default 20.
      # ONETEAM_ENROLLMENT_MAX_FAILURES: ${ONETEAM_ENROLLMENT_MAX_FAILURES:-20}
      # ------------------------------------------------------------------
      # Cross-replica consistency — only relevant if you run more than one API.
      # ------------------------------------------------------------------
      # Reads come from an in-memory snapshot, so a second replica would never
      # see the first one's writes. This polls a change counter in the database
      # and reloads when it moves, bounding how stale a replica can be.
      #
      # With one replica it costs a single row read per interval. Set to 0 to
      # disable — but do that only if you are certain there is one replica,
      # because a disabled loop means replicas silently diverge.
      #
      # ONETEAM_REFRESH_MS: ${ONETEAM_REFRESH_MS:-1000}
      # Set to 0 to manage the schema yourself (psql, a migration tool). Left at
      # the default, the API applies db/api-schema.sql and db/migrations/*.sql
      # itself on start-up, which is what makes a deploy self-sufficient.
      # ONETEAM_AUTO_MIGRATE: ${ONETEAM_AUTO_MIGRATE:-1}
    ports:
      - "3001:3001"
    healthcheck:
      # /api/health, not /api/tasks — the latter is behind AuthGuard and answers
      # 401, which the healthcheck would read as "unhealthy".
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oneteam-network

  # ----------------------------------------------------------------------------
  # 3. oneTeam Supervisor Web Dashboard (Nginx + React SPA)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # Build-time only. Setting these under `environment:` would have no effect
      # because Vite has already inlined them into the bundle by then.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: oneteam-web
    restart: always
    environment:
      # Runtime value, substituted into nginx.conf at container start — see
      # web/Dockerfile. On Railway this is overridden with the API's private
      # address (http://api.railway.internal:3001).
      API_UPSTREAM: http://api:3001
    depends_on:
      - api
    ports:
      - "80:80"
      - "5173:80"
    healthcheck:
      # 127.0.0.1 rather than localhost: see web/Dockerfile. `localhost` resolves
      # to ::1 first in this image, and a refused IPv6 connection would be read
      # as a failed healthcheck while nginx is serving on IPv4.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - oneteam-network

  # ----------------------------------------------------------------------------
  # 4. oneTeam Field Merchandiser Telegram Bot Service
  # ----------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: oneteam-bot
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - it must point at the postgres service}
      API_BASE_URL: http://api:3001
    networks:
      - oneteam-network

volumes:
  postgres_data:
    driver: local

networks:
  oneteam-network:
    driver: bridge
